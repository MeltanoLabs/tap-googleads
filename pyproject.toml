[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.8.10,<0.9" ]

[project]
name = "tap-googleads"
version = "0.9.0"
description = "`tap-googleads` is a Singer tap for GoogleAds, built with the Meltano SDK for Singer Taps."
readme = "README.md"
keywords = [
  "ELT",
  "GoogleAds",
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pyhumps~=3.8",
  "requests~=2.34",
  "singer-sdk~=0.54.5",
  "sqlglot>=27.15.3",
]
[[project.authors]]
name = "AutoIDM"

[[project.authors]]
name = "Matatika"
[project.scripts]
tap-googleads = "tap_googleads.tap:TapGoogleAds.cli"

[dependency-groups]
dev = [
  "mypy>=2.3",
  "pytest>=9",
  "responses>=0.25.7",
]

[tool.uv.build-backend]
module-name = "tap_googleads"
module-root = ""

[tool.ruff]
line-length = 140

[tool.pyproject-fmt]
max_supported_python = "3.14"
table_format = "long"

[tool.tox]
requires = [
  "tox>=4.55",
  "tox-uv>=1.35",
]
env_list = [
  { prefix = "3.", start = 10 },
]
[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
description = "run unit tests on Python {py_dot_ver}"
dependency_groups = [ "dev" ]
pass_env = [ "PYTEST_*", "TAP_GOOGLEADS_*" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tap_googleads/tests" ], extend = true } ] ]
